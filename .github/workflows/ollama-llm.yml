name: Ollama LLM Experiment

on:
  workflow_dispatch:
    inputs:
      models:
        description: "Comma- or newline-separated Ollama models to pull and run"
        required: true
        default: |
          llama3.2:3b
          gemma3:1b
          qwen2.5:1.5b
      questions:
        description: "Answerable LLM questions split across current/stable/document"
        required: true
        default: "30"
      unknown:
        description: "Additional unanswerable UNKNOWN questions"
        required: true
        default: "5"
      timeout_ms:
        description: "Per-request Ollama timeout in milliseconds"
        required: true
        default: "120000"
      num_predict:
        description: "Maximum generated tokens per answer"
        required: true
        default: "64"
      cache_version:
        description: "Bump this value to force a fresh Ollama model cache"
        required: true
        default: "v1"
      publish_results:
        description: "Commit verified RESULTS.md and per-model results history back to the branch"
        required: true
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  prepare-matrix:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      matrix: ${{ steps.matrix.outputs.matrix }}

    steps:
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Build model matrix
        id: matrix
        env:
          MODELS: ${{ inputs.models }}
          QUESTIONS: ${{ inputs.questions }}
          UNKNOWN: ${{ inputs.unknown }}
          TIMEOUT_MS: ${{ inputs.timeout_ms }}
          NUM_PREDICT: ${{ inputs.num_predict }}
        run: |
          node --input-type=module - <<'NODE'
          import { appendFileSync } from "node:fs";

          const values = {
            QUESTIONS: process.env.QUESTIONS,
            UNKNOWN: process.env.UNKNOWN,
            TIMEOUT_MS: process.env.TIMEOUT_MS,
            NUM_PREDICT: process.env.NUM_PREDICT
          };

          for (const [name, value] of Object.entries(values)) {
            if (!/^\d+$/.test(value ?? "")) {
              throw new Error(`${name} must be a non-negative integer, got "${value}"`);
            }
          }

          if (Number(values.QUESTIONS) <= 0) throw new Error("QUESTIONS must be greater than 0");
          if (Number(values.TIMEOUT_MS) < 1000) throw new Error("TIMEOUT_MS must be at least 1000");
          if (Number(values.NUM_PREDICT) <= 0) throw new Error("NUM_PREDICT must be greater than 0");

          const models = [...new Set(
            String(process.env.MODELS ?? "")
              .split(/[\n,]+/u)
              .map((model) => model.trim())
              .filter(Boolean)
          )];

          if (models.length === 0) {
            throw new Error("At least one model must be provided.");
          }

          const include = models.map((model) => {
            if (!/^[A-Za-z0-9._:/-]+$/.test(model)) {
              throw new Error(`Unsafe model name: ${model}`);
            }

            return {
              model,
              safe_model: model.replace(/[/:]/gu, "-")
            };
          });

          const matrix = JSON.stringify({ include });
          console.log(`Model matrix: ${matrix}`);
          appendFileSync(process.env.GITHUB_OUTPUT, `matrix=${matrix}\n`);
          NODE

  quality-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: prepare-matrix

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Run static checks and unit tests
        run: |
          npm run check
          npm test

      - name: Verify checked-in benchmark results before LLM run
        run: |
          npm run results
          node scripts/verifyResults.mjs
          node scripts/ensureAllowedChanges.mjs RESULTS.md

  llm-experiment:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    needs:
      - prepare-matrix
      - quality-gate
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.prepare-matrix.outputs.matrix) }}
    concurrency:
      group: ollama-llm-${{ github.ref }}-${{ matrix.safe_model }}
      cancel-in-progress: false
    env:
      OLLAMA_MODELS: ${{ github.workspace }}/.ollama/models

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Ollama
        run: curl -fsSL https://ollama.com/install.sh | sh

      - name: Prepare Ollama model cache
        id: ollama-cache-key
        env:
          MODEL_NAME: ${{ matrix.model }}
          SAFE_MODEL: ${{ matrix.safe_model }}
          CACHE_VERSION: ${{ inputs.cache_version }}
        run: |
          mkdir -p "$OLLAMA_MODELS"
          safe_version="$(printf '%s' "$CACHE_VERSION" | sed 's#[/:]#-#g')"
          echo "key=ollama-${RUNNER_OS}-${SAFE_MODEL}-${safe_version}" >> "$GITHUB_OUTPUT"

      - name: Restore Ollama model cache
        id: ollama-model-cache
        uses: actions/cache@v4
        with:
          path: ${{ env.OLLAMA_MODELS }}
          key: ${{ steps.ollama-cache-key.outputs.key }}
          restore-keys: |
            ollama-${{ runner.os }}-

      - name: Report Ollama cache status
        run: echo "cache-hit=${{ steps.ollama-model-cache.outputs.cache-hit }}"

      - name: Start Ollama server
        run: |
          nohup ollama serve > ollama.log 2>&1 &
          for attempt in {1..45}; do
            if ollama list >/dev/null 2>&1; then
              echo "Ollama is ready."
              exit 0
            fi
            sleep 2
          done
          echo "::error::Ollama did not become ready in time."
          cat ollama.log
          exit 1

      - name: Pull model
        env:
          MODEL_NAME: ${{ matrix.model }}
        run: ollama pull "$MODEL_NAME"

      - name: Run mixed LLM experiment
        env:
          MODEL_NAME: ${{ matrix.model }}
          QUESTIONS: ${{ inputs.questions }}
          UNKNOWN: ${{ inputs.unknown }}
          TIMEOUT_MS: ${{ inputs.timeout_ms }}
          NUM_PREDICT: ${{ inputs.num_predict }}
          MODEL_RESULTS_DIR: results/models/${{ matrix.safe_model }}
        run: |
          npm run experiment:llm -- \
            --model="$MODEL_NAME" \
            --questions="$QUESTIONS" \
            --unknown="$UNKNOWN" \
            --timeout-ms="$TIMEOUT_MS" \
            --num-predict="$NUM_PREDICT" \
            --results-dir="$MODEL_RESULTS_DIR/llm"

      - name: Run real trace with Ollama extractor
        env:
          MODEL_NAME: ${{ matrix.model }}
          TIMEOUT_MS: ${{ inputs.timeout_ms }}
          NUM_PREDICT: ${{ inputs.num_predict }}
          MODEL_RESULTS_DIR: results/models/${{ matrix.safe_model }}
        run: |
          EXTRACTOR_NUM_PREDICT="$NUM_PREDICT"
          if [ "$EXTRACTOR_NUM_PREDICT" -lt 256 ]; then
            EXTRACTOR_NUM_PREDICT=256
          fi
          npm run experiment:real -- \
            --llm-extractor \
            --model="$MODEL_NAME" \
            --timeout-ms="$TIMEOUT_MS" \
            --num-predict="$EXTRACTOR_NUM_PREDICT" \
            --results-dir="$MODEL_RESULTS_DIR/real"

      - name: Run extractor benchmark with Ollama extractor
        env:
          MODEL_NAME: ${{ matrix.model }}
          TIMEOUT_MS: ${{ inputs.timeout_ms }}
          NUM_PREDICT: ${{ inputs.num_predict }}
          MODEL_RESULTS_DIR: results/models/${{ matrix.safe_model }}
        run: |
          EXTRACTOR_NUM_PREDICT="$NUM_PREDICT"
          if [ "$EXTRACTOR_NUM_PREDICT" -lt 256 ]; then
            EXTRACTOR_NUM_PREDICT=256
          fi
          npm run experiment:extractor -- \
            --llm-extractor \
            --model="$MODEL_NAME" \
            --timeout-ms="$TIMEOUT_MS" \
            --num-predict="$EXTRACTOR_NUM_PREDICT" \
            --results-dir="$MODEL_RESULTS_DIR/extractor"

      - name: Stage model artifacts
        if: always()
        env:
          SAFE_MODEL: ${{ matrix.safe_model }}
        run: |
          mkdir -p artifact
          if [ -d "results/models/$SAFE_MODEL" ]; then
            mkdir -p artifact/results/models
            cp -R "results/models/$SAFE_MODEL" artifact/results/models/
          fi
          if [ -f ollama.log ]; then
            cp ollama.log "artifact/ollama-$SAFE_MODEL.log"
          fi

      - name: Upload model results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ollama-results-${{ matrix.safe_model }}
          if-no-files-found: warn
          path: artifact

  aggregate-results:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs:
      - quality-gate
      - llm-experiment
    if: ${{ always() }}
    concurrency:
      group: ollama-llm-publish-${{ github.ref }}
      cancel-in-progress: false
    env:
      ARTIFACT_DIR: ollama-artifacts

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Download model result artifacts
        uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          path: ${{ env.ARTIFACT_DIR }}
          pattern: ollama-results-*
          merge-multiple: true

      - name: Merge model results and verify report
        run: |
          if [ -d "$ARTIFACT_DIR/results/models" ]; then
            mkdir -p results/models
            cp -R "$ARTIFACT_DIR/results/models/." results/models/
          fi
          npm run results
          node scripts/verifyResults.mjs
          node scripts/ensureAllowedChanges.mjs RESULTS.md results/models/
          if [ "${{ needs.llm-experiment.result }}" != "success" ]; then
            echo "::warning::At least one model job failed. Partial artifacts were still merged when available."
          fi

      - name: Commit verified multi-model results
        if: ${{ inputs.publish_results == true && needs.llm-experiment.result == 'success' }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add RESULTS.md results/models
          node scripts/ensureAllowedChanges.mjs RESULTS.md results/models/
          if git diff --cached --quiet; then
            echo "No verified Ollama result changes to commit."
          else
            git commit -m "Update verified multi-model Ollama results"
            git push
          fi

      - name: Upload aggregated Ollama results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ollama-results-aggregated-${{ github.run_id }}
          if-no-files-found: warn
          path: |
            RESULTS.md
            results/models
            ${{ env.ARTIFACT_DIR }}/*.log
